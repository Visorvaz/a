<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor 3D - Casa1</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      max-width: 1000px;
      max-height: 800px;
      background-color: #111;
    }
  </style>
</head>
<body>
  <model-viewer 
      src="./casa1.glb"
      alt="Modelo 3D de la Casa"
      auto-rotate
      camera-controls
      ar
      shadow-intensity="1"
      loading="eager">
  </model-viewer>
</body>
</html>
